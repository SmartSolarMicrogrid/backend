# CI build check for the SSMTS Web API.
# Runs on every push and pull request. It only verifies the code compiles;
# deployment to IIS is a manual step documented in the README.
name: Build API

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SmartSolarMicrogrid.API/SmartSolarMicrogrid.API.csproj

      - name: Build (Release)
        run: dotnet build SmartSolarMicrogrid.API/SmartSolarMicrogrid.API.csproj -c Release --no-restore

      - name: Publish (verifies IIS publish output)
        run: dotnet publish SmartSolarMicrogrid.API/SmartSolarMicrogrid.API.csproj -c Release --no-build -o publish

      - name: Upload publish folder
        uses: actions/upload-artifact@v4
        with:
          name: ssmts-api-publish
          path: publish
          retention-days: 7
